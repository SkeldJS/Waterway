name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - run: node ./scripts/fetchSkeldjs.js
      env:
        SKELDJS_REPO: ${{ vars.SKELDJS_REPO }}
        SKELDJS_REF: ${{ vars.SKELDJS_REF }}
    - run: yarn
    - run: yarn build
